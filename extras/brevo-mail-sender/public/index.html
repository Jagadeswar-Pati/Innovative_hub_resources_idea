<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brevo Mail Sender</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 560px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #555; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    textarea { min-height: 160px; resize: vertical; }
    button {
      margin-top: 0.75rem;
      padding: 0.65rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0b5ed7; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; }
    .message.success { background: #d1e7dd; color: #0a3622; }
    .message.error { background: #f8d7da; color: #58151c; }
  </style>
</head>
<body>
  <h1>Brevo Mail Sender</h1>
  <p>Paste your message below and click Send. It will be sent to the email configured on the server (TO_EMAIL).</p>

  <form id="form">
    <label for="subject">Subject (optional)</label>
    <input type="text" id="subject" name="subject" placeholder="Message from Brevo Mail Sender" />

    <label for="message">Message *</label>
    <textarea id="message" name="message" placeholder="Paste or type your message here..." required></textarea>

    <button type="submit" id="btn">Send</button>
  </form>

  <div id="feedback" class="message" role="alert" style="display: none;"></div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const feedback = document.getElementById('feedback');

    function show(msg, isError) {
      feedback.textContent = msg;
      feedback.className = 'message ' + (isError ? 'error' : 'success');
      feedback.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      feedback.style.display = 'none';

      const message = document.getElementById('message').value.trim();
      const subject = document.getElementById('subject').value.trim() || 'Message from Brevo Mail Sender';

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, subject }),
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.success) {
          show('Email sent successfully.');
          document.getElementById('message').value = '';
        } else {
          show(data.error || 'Failed to send.', true);
        }
      } catch (err) {
        show(err.message || 'Network error.', true);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
